version: v2
modules:
  - path: api
deps:
  - buf.build/googleapis/googleapis
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    # Existing v1 endpoints return domain resources directly rather than an
    # operation-named wrapper; retaining that JSON shape is a migration invariant.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
