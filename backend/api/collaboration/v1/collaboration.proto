syntax = "proto3";
package collaboration.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "types/v1/types.proto";

option go_package = "agent-platform/backend/api/collaboration/v1;collaborationv1";

service CollaborationService {
  rpc ListCodingTasks(ListCodingTasksRequest) returns (ListCodingTasksResponse) { option (google.api.http) = {get: "/v1/coding-tasks"}; }
  rpc CreateCodingTask(CreateCodingTaskRequest) returns (CreateCodingTaskResponse) { option (google.api.http) = {post: "/v1/coding-tasks" body: "*"}; }
  rpc GetCodingTask(GetCodingTaskRequest) returns (CodingTask) { option (google.api.http) = {get: "/v1/coding-tasks/{task_id}"}; }
  rpc UpdateCodingTask(UpdateCodingTaskRequest) returns (CodingTask) { option (google.api.http) = {patch: "/v1/coding-tasks/{task_id}" body: "*"}; }
  rpc ContinueCodingTask(ContinueCodingTaskRequest) returns (ContinueCodingTaskResponse) { option (google.api.http) = {post: "/v1/coding-tasks/{task_id}/runs" body: "*"}; }
  rpc GetCodingTaskSession(GetCodingTaskSessionRequest) returns (Session) { option (google.api.http) = {get: "/v1/coding-tasks/{task_id}/session"}; }
  rpc UpdateCodingTaskSession(UpdateCodingTaskSessionRequest) returns (Session) { option (google.api.http) = {patch: "/v1/coding-tasks/{task_id}/session" body: "*"}; }
  rpc ListSessionMessages(ListSessionMessagesRequest) returns (ListSessionMessagesResponse) { option (google.api.http) = {get: "/v1/coding-tasks/{task_id}/messages"}; }
  rpc ListMemoryCandidates(ListMemoryCandidatesRequest) returns (ListMemoryCandidatesResponse) { option (google.api.http) = {get: "/v1/coding-tasks/{task_id}/memory-candidates"}; }
  rpc ProposeMemoryCandidate(ProposeMemoryCandidateRequest) returns (MemoryCandidate) { option (google.api.http) = {post: "/v1/coding-tasks/{task_id}/memory-candidates" body: "*"}; }
  rpc DecideMemoryCandidate(DecideMemoryCandidateRequest) returns (DecideMemoryCandidateResponse) { option (google.api.http) = {patch: "/v1/memory-candidates/{candidate_id}" body: "*"}; }
  rpc ListAgentMemories(ListAgentMemoriesRequest) returns (ListAgentMemoriesResponse) { option (google.api.http) = {get: "/v1/agents/{agent_id}/memories"}; }
  rpc UpdateAgentMemory(UpdateAgentMemoryRequest) returns (AgentMemory) { option (google.api.http) = {patch: "/v1/agent-memories/{memory_id}" body: "*"}; }
  rpc DeleteAgentMemory(DeleteAgentMemoryRequest) returns (AgentMemory) { option (google.api.http) = {post: "/v1/agent-memories/{memory_id}/deletion" body: "*"}; }
}

message ListCodingTasksRequest { string team_id = 1; }
message ListCodingTasksResponse { repeated CodingTask items = 1; }
message CreateCodingTaskRequest { string team_id = 1; string agent_release_id = 2; string title = 3; string request_text = 4; optional types.v1.IssueSnapshot issue_snapshot = 5; }
message CreateCodingTaskResponse { CodingTask task = 1; Session session = 2; string run_id = 3; }
message GetCodingTaskRequest { string task_id = 1; string team_id = 2; }
message GetCodingTaskResponse { CodingTask task = 1; }
message UpdateCodingTaskRequest { string task_id = 1; string team_id = 2; string state = 3; }
message UpdateCodingTaskResponse { CodingTask task = 1; }
message ContinueCodingTaskRequest { string task_id = 1; string team_id = 2; string request_text = 3; int64 expected_session_version = 4; }
message ContinueCodingTaskResponse { CodingTask task = 1; Session session = 2; string run_id = 3; }
message GetCodingTaskSessionRequest { string task_id = 1; string team_id = 2; }
message GetCodingTaskSessionResponse { Session session = 1; }
message UpdateCodingTaskSessionRequest { string task_id = 1; string team_id = 2; types.v1.SessionMemory memory = 3; }
message UpdateCodingTaskSessionResponse { Session session = 1; }
message ListSessionMessagesRequest { string task_id = 1; string team_id = 2; optional int64 after = 3; optional int32 limit = 4; }
message ListSessionMessagesResponse { repeated SessionMessage items = 1; }
message ListMemoryCandidatesRequest { string task_id = 1; string team_id = 2; }
message ListMemoryCandidatesResponse { repeated MemoryCandidate items = 1; }
message ProposeMemoryCandidateRequest { string task_id = 1; string team_id = 2; string agent_id = 3; string content = 4; }
message ProposeMemoryCandidateResponse { MemoryCandidate candidate = 1; }
message DecideMemoryCandidateRequest { string candidate_id = 1; string team_id = 2; bool approve = 3; }
message DecideMemoryCandidateResponse { MemoryCandidate candidate = 1; optional AgentMemory memory = 2; }
message ListAgentMemoriesRequest { string agent_id = 1; string team_id = 2; optional bool include_deleted = 3; }
message ListAgentMemoriesResponse { repeated AgentMemory items = 1; }
message UpdateAgentMemoryRequest { string memory_id = 1; string team_id = 2; string content = 3; bool enabled = 4; }
message UpdateAgentMemoryResponse { AgentMemory memory = 1; }
message DeleteAgentMemoryRequest { string memory_id = 1; string team_id = 2; }
message DeleteAgentMemoryResponse { AgentMemory memory = 1; }

message CodingTask {
  string id = 1; string team_id = 2; string agent_release_id = 3; string created_by = 4; string title = 5;
  string request_text = 6; optional types.v1.IssueSnapshot issue_snapshot = 7; string state = 8;
  google.protobuf.Timestamp created_at = 9; google.protobuf.Timestamp updated_at = 10;
  optional google.protobuf.Timestamp completed_at = 11; int64 version = 12;
}
message Session {
  string id = 1; string coding_task_id = 2; string repository_binding_id = 3; string target_branch = 4;
  string review_branch = 5; types.v1.SessionMemory memory = 6; int32 run_count = 7;
  google.protobuf.Timestamp created_at = 8; google.protobuf.Timestamp updated_at = 9; int64 version = 10;
}
message SessionMessage {
  int64 id = 1; optional string run_id = 2; string author = 3; optional string author_user_id = 4;
  types.v1.SessionMessageContent content = 5; google.protobuf.Timestamp created_at = 6;
}
message MemoryCandidate {
  string id = 1; string agent_id = 2; string coding_task_id = 3; string proposed_content = 4; string state = 5;
  google.protobuf.Timestamp proposed_at = 6; optional string decided_by = 7;
  optional google.protobuf.Timestamp decided_at = 8; optional string resulting_memory_id = 9;
}
message AgentMemory {
  string id = 1; string agent_id = 2; string content = 3; string approved_by = 4; optional string source_task_id = 5;
  bool enabled = 6; google.protobuf.Timestamp created_at = 7; google.protobuf.Timestamp updated_at = 8;
  optional google.protobuf.Timestamp deleted_at = 9; int64 version = 10;
}
