syntax = "proto3";

package workspace.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "agent-platform/backend/api/workspace/v1;workspacev1";

service AgentWorkspaceService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUser) { option (google.api.http) = {get: "/api/v1/me"}; }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) { option (google.api.http) = {get: "/api/v1/admin/users"}; }
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) { option (google.api.http) = {post: "/api/v1/admin/users" body: "*"}; }
  rpc SetUserEnabled(SetUserEnabledRequest) returns (UserAccount) { option (google.api.http) = {patch: "/api/v1/admin/users/{user_id}/enabled" body: "*"}; }
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (ResetUserPasswordResponse) { option (google.api.http) = {post: "/api/v1/admin/users/{user_id}/password-reset" body: "*"}; }
  rpc GetCreditBalance(GetCreditBalanceRequest) returns (CreditBalance) { option (google.api.http) = {get: "/api/v1/credits/balance"}; }
  rpc ListCreditLedger(ListCreditLedgerRequest) returns (ListCreditLedgerResponse) { option (google.api.http) = {get: "/api/v1/credits/ledger"}; }
  rpc RedeemCreditCode(RedeemCreditCodeRequest) returns (CreditBalance) { option (google.api.http) = {post: "/api/v1/credits/redemptions" body: "*"}; }
  rpc ConfigureUserDailyCredits(ConfigureUserDailyCreditsRequest) returns (CreditBalance) { option (google.api.http) = {patch: "/api/v1/admin/users/{user_id}/daily-credits" body: "*"}; }
  rpc AdjustUserCredits(AdjustUserCreditsRequest) returns (CreditBalance) { option (google.api.http) = {post: "/api/v1/admin/users/{user_id}/credit-adjustments" body: "*"}; }
  rpc ListModelCreditRates(ListModelCreditRatesRequest) returns (ListModelCreditRatesResponse) { option (google.api.http) = {get: "/api/v1/admin/model-credit-rates"}; }
  rpc CreateModelCreditRate(CreateModelCreditRateRequest) returns (ModelCreditRate) { option (google.api.http) = {post: "/api/v1/admin/model-credit-rates" body: "*"}; }
  rpc CreateRedemptionCodeBatch(CreateRedemptionCodeBatchRequest) returns (RedemptionCodeBatch) { option (google.api.http) = {post: "/api/v1/admin/redemption-code-batches" body: "*"}; }
  rpc ListRedemptionCodes(ListRedemptionCodesRequest) returns (ListRedemptionCodesResponse) { option (google.api.http) = {get: "/api/v1/admin/redemption-codes"}; }
  rpc VoidRedemptionCode(VoidRedemptionCodeRequest) returns (RedemptionCodeStatus) { option (google.api.http) = {post: "/api/v1/admin/redemption-codes/{code_id}/void" body: "*"}; }

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) { option (google.api.http) = {get: "/api/v1/sessions"}; }
  rpc CreateSession(CreateSessionRequest) returns (Session) { option (google.api.http) = {post: "/api/v1/sessions" body: "*"}; }
  rpc GetSession(GetSessionRequest) returns (Session) { option (google.api.http) = {get: "/api/v1/sessions/{session_id}"}; }
  rpc UpdateSession(UpdateSessionRequest) returns (Session) { option (google.api.http) = {patch: "/api/v1/sessions/{session_id}" body: "*"}; }
  rpc SetSessionArchived(SetSessionArchivedRequest) returns (Session) { option (google.api.http) = {patch: "/api/v1/sessions/{session_id}/archived" body: "*"}; }
  rpc SetSessionExpertSelection(SetSessionExpertSelectionRequest) returns (Session) { option (google.api.http) = {patch: "/api/v1/sessions/{session_id}/expert-selection" body: "*"}; }
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/sessions/{session_id}"}; }
  rpc ListSessionMessages(ListSessionMessagesRequest) returns (ListSessionMessagesResponse) { option (google.api.http) = {get: "/api/v1/sessions/{session_id}/messages"}; }
  rpc SendSessionMessage(SendSessionMessageRequest) returns (SendSessionMessageResponse) { option (google.api.http) = {post: "/api/v1/sessions/{session_id}/messages" body: "*"}; }
  rpc RetrySessionMessage(RetrySessionMessageRequest) returns (SendSessionMessageResponse) { option (google.api.http) = {post: "/api/v1/sessions/{session_id}/messages/{message_id}/retry" body: "*"}; }
  rpc CancelSessionMessage(CancelSessionMessageRequest) returns (SessionMessage) { option (google.api.http) = {post: "/api/v1/sessions/{session_id}/messages/{message_id}/cancellation" body: "*"}; }

  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) { option (google.api.http) = {get: "/api/v1/workflows"}; }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (Workflow) { option (google.api.http) = {post: "/api/v1/workflows" body: "*"}; }
  rpc GetWorkflow(GetWorkflowRequest) returns (Workflow) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}"}; }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (Workflow) { option (google.api.http) = {patch: "/api/v1/workflows/{workflow_id}" body: "*"}; }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/workflows/{workflow_id}"}; }
  rpc GenerateWorkflowCredential(GenerateWorkflowCredentialRequest) returns (WorkflowCredential) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/api-credential" body: "*"}; }
  rpc ExchangeWorkflowCredential(ExchangeWorkflowCredentialRequest) returns (WorkflowAccessToken) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/api-token" body: "*"}; }
  rpc RunWorkflow(RunWorkflowRequest) returns (Run) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/runs" body: "*"}; }
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/runs"}; }
  rpc GetRun(GetRunRequest) returns (Run) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/runs/{run_id}"}; }
  rpc ListRunTurns(ListRunTurnsRequest) returns (ListRunsResponse) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/runs/{run_id}/turns"}; }
  rpc ContinueRunConversation(ContinueRunConversationRequest) returns (Run) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/runs/{run_id}/turns" body: "*"}; }
  rpc CancelRun(CancelRunRequest) returns (Run) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/runs/{run_id}/cancellation" body: "*"}; }
  rpc RerunWorkflow(RerunWorkflowRequest) returns (Run) { option (google.api.http) = {post: "/api/v1/workflows/{workflow_id}/runs/{run_id}/rerun" body: "*"}; }
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/artifacts"}; }
  rpc GetArtifactDownload(GetArtifactDownloadRequest) returns (ArtifactDownload) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/artifacts/{artifact_id}/download"}; }

  rpc ListWorkspaceEntries(ListWorkspaceEntriesRequest) returns (ListWorkspaceEntriesResponse) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/workspace"}; }
  rpc GetWorkspaceFile(GetWorkspaceFileRequest) returns (WorkspaceFile) { option (google.api.http) = {get: "/api/v1/workflows/{workflow_id}/workspace/file"}; }
  rpc ConfigureWorkflowGitSource(ConfigureWorkflowGitSourceRequest) returns (Workflow) { option (google.api.http) = {put: "/api/v1/workflows/{workflow_id}/git-source" body: "*"}; }

  rpc ListExperts(ListExpertsRequest) returns (ListExpertsResponse) { option (google.api.http) = {get: "/api/v1/experts"}; }
  rpc GetExpert(GetExpertRequest) returns (Expert) { option (google.api.http) = {get: "/api/v1/experts/{expert_id}"}; }
  rpc CreateExpert(CreateExpertRequest) returns (Expert) { option (google.api.http) = {post: "/api/v1/experts" body: "*"}; }
  rpc UpdateExpert(UpdateExpertRequest) returns (Expert) { option (google.api.http) = {patch: "/api/v1/experts/{expert_id}" body: "*"}; }
  rpc DeleteExpert(DeleteExpertRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/experts/{expert_id}"}; }
  rpc ListExpertTeams(ListExpertTeamsRequest) returns (ListExpertTeamsResponse) { option (google.api.http) = {get: "/api/v1/expert-teams"}; }
  rpc GetExpertTeam(GetExpertTeamRequest) returns (ExpertTeam) { option (google.api.http) = {get: "/api/v1/expert-teams/{expert_team_id}"}; }
  rpc CreateExpertTeam(CreateExpertTeamRequest) returns (ExpertTeam) { option (google.api.http) = {post: "/api/v1/expert-teams" body: "*"}; }
  rpc UpdateExpertTeam(UpdateExpertTeamRequest) returns (ExpertTeam) { option (google.api.http) = {patch: "/api/v1/expert-teams/{expert_team_id}" body: "*"}; }
  rpc DeleteExpertTeam(DeleteExpertTeamRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/expert-teams/{expert_team_id}"}; }

  rpc GetSettings(GetSettingsRequest) returns (PersonalSettings) { option (google.api.http) = {get: "/api/v1/settings"}; }
  rpc UpdateSettings(UpdateSettingsRequest) returns (PersonalSettings) { option (google.api.http) = {patch: "/api/v1/settings" body: "*"}; }
  rpc ListRuntimeEngines(ListRuntimeEnginesRequest) returns (ListRuntimeEnginesResponse) { option (google.api.http) = {get: "/api/v1/runtime-engines"}; }
  rpc ListModelProviderPresets(ListModelProviderPresetsRequest) returns (ListModelProviderPresetsResponse) { option (google.api.http) = {get: "/api/v1/model-provider-presets"}; }
  rpc ListModelProviderConnections(ListModelProviderConnectionsRequest) returns (ListModelProviderConnectionsResponse) { option (google.api.http) = {get: "/api/v1/model-provider-connections"}; }
  rpc CreateModelProviderConnection(CreateModelProviderConnectionRequest) returns (ModelProviderConnection) { option (google.api.http) = {post: "/api/v1/model-provider-connections" body: "*"}; }
  rpc UpdateModelProviderConnection(UpdateModelProviderConnectionRequest) returns (ModelProviderConnection) { option (google.api.http) = {patch: "/api/v1/model-provider-connections/{connection_id}" body: "*"}; }
  rpc DeleteModelProviderConnection(DeleteModelProviderConnectionRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/model-provider-connections/{connection_id}"}; }
  rpc RefreshProviderModels(RefreshProviderModelsRequest) returns (ModelProviderConnection) { option (google.api.http) = {post: "/api/v1/model-provider-connections/{connection_id}/refresh" body: "*"}; }
  rpc CreateProviderModel(CreateProviderModelRequest) returns (ProviderModel) { option (google.api.http) = {post: "/api/v1/model-provider-connections/{connection_id}/models" body: "*"}; }

  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse) { option (google.api.http) = {get: "/api/v1/extensions/mcp"}; }
  rpc CreateMCPServer(CreateMCPServerRequest) returns (MCPServer) { option (google.api.http) = {post: "/api/v1/extensions/mcp" body: "*"}; }
  rpc UpdateMCPServer(UpdateMCPServerRequest) returns (MCPServer) { option (google.api.http) = {patch: "/api/v1/extensions/mcp/{mcp_server_id}" body: "*"}; }
  rpc TestMCPServer(TestMCPServerRequest) returns (MCPServer) { option (google.api.http) = {post: "/api/v1/extensions/mcp/{mcp_server_id}/test" body: "*"}; }
  rpc DeleteMCPServer(DeleteMCPServerRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/extensions/mcp/{mcp_server_id}"}; }
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) { option (google.api.http) = {get: "/api/v1/extensions/skills"}; }
  rpc CreateSkill(CreateSkillRequest) returns (Skill) { option (google.api.http) = {post: "/api/v1/extensions/skills" body: "*"}; }
  rpc UpdateSkill(UpdateSkillRequest) returns (Skill) { option (google.api.http) = {patch: "/api/v1/extensions/skills/{skill_id}" body: "*"}; }
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteResponse) { option (google.api.http) = {delete: "/api/v1/extensions/skills/{skill_id}"}; }
}

message GetCurrentUserRequest {}
message CurrentUser { string id = 1; string username = 2; string email = 3; string display_name = 4; bool administrator = 5; bool settings_ready = 6; optional CreditBalance credit_balance = 7; }
message ListUsersRequest {}
message ListUsersResponse { repeated UserAccount items = 1; }
message CreateUserRequest { string username = 1; string display_name = 2; string email = 3; }
message CreateUserResponse { UserAccount user = 1; string temporary_password = 2; }
message SetUserEnabledRequest { string user_id = 1; bool enabled = 2; int64 expected_version = 3; }
message ResetUserPasswordRequest { string user_id = 1; }
message ResetUserPasswordResponse { string temporary_password = 1; }
message UserAccount { string id = 1; string username = 2; string email = 3; string display_name = 4; bool administrator = 5; bool enabled = 6; google.protobuf.Timestamp created_at = 7; int64 version = 8; optional CreditBalance credit_balance = 9; }

message GetCreditBalanceRequest {}
message CreditBalance { int64 total_hundredths = 1; int64 daily_remaining_hundredths = 2; int64 persistent_hundredths = 3; int64 today_consumed_hundredths = 4; int64 daily_allocation_hundredths = 5; string credit_day = 6; string timezone = 7; google.protobuf.Timestamp next_allocation_at = 8; optional int64 pending_daily_allocation_hundredths = 9; optional string pending_effective_day = 10; int64 version = 11; }
message ListCreditLedgerRequest { optional string cursor = 1; optional int32 limit = 2; }
message ListCreditLedgerResponse { repeated CreditLedgerEntry items = 1; optional string next_cursor = 2; }
message CreditLedgerEntry { string id = 1; string type = 2; int64 amount_hundredths = 3; int64 resulting_balance_hundredths = 4; string credit_day = 5; optional string reason = 6; google.protobuf.Timestamp created_at = 7; }
message RedeemCreditCodeRequest { string code = 1; }
message ConfigureUserDailyCreditsRequest { string user_id = 1; int64 allocation_hundredths = 2; }
message AdjustUserCreditsRequest { string user_id = 1; int64 amount_hundredths = 2; string reason = 3; string request_id = 4; }
message ListModelCreditRatesRequest {}
message ListModelCreditRatesResponse { repeated ModelCreditRate items = 1; }
message ModelCreditRate { string revision_id = 1; optional string provider_type = 2; optional string api_protocol = 3; optional string provider_model_id = 4; int64 input_multiplier_micros = 5; int64 output_multiplier_micros = 6; int64 fallback_hundredths = 7; google.protobuf.Timestamp created_at = 8; optional google.protobuf.Timestamp superseded_at = 9; }
message CreateModelCreditRateRequest { optional string provider_type = 1; optional string api_protocol = 2; optional string provider_model_id = 3; int64 input_multiplier_micros = 4; int64 output_multiplier_micros = 5; int64 fallback_hundredths = 6; optional string expected_revision_id = 7; }
message CreateRedemptionCodeBatchRequest { int32 count = 1; int64 value_hundredths = 2; optional google.protobuf.Timestamp expires_at = 3; }
message RedemptionCodeBatch { string id = 1; int32 count = 2; int64 value_hundredths = 3; optional google.protobuf.Timestamp expires_at = 4; google.protobuf.Timestamp created_at = 5; repeated RedemptionCode codes = 6; }
message RedemptionCode { string id = 1; string identifier = 2; string plaintext = 3; string state = 4; }
message ListRedemptionCodesRequest { optional string cursor = 1; optional int32 limit = 2; }
message ListRedemptionCodesResponse { repeated RedemptionCodeStatus items = 1; optional string next_cursor = 2; }
message VoidRedemptionCodeRequest { string code_id = 1; }
message RedemptionCodeStatus { string id = 1; string batch_id = 2; string identifier = 3; string state = 4; int64 value_hundredths = 5; optional google.protobuf.Timestamp expires_at = 6; optional google.protobuf.Timestamp redeemed_at = 7; optional google.protobuf.Timestamp voided_at = 8; google.protobuf.Timestamp created_at = 9; }

message ListSessionsRequest { bool archived = 1; }
message ListSessionsResponse { repeated Session items = 1; }
message CreateSessionRequest { optional string expert_id = 1; optional string expert_team_id = 2; }
message GetSessionRequest { string session_id = 1; }
message UpdateSessionRequest { string session_id = 1; string title = 2; int64 expected_version = 3; }
message SetSessionArchivedRequest { string session_id = 1; bool archived = 2; int64 expected_version = 3; }
message SetSessionExpertSelectionRequest { string session_id = 1; optional string expert_id = 2; optional string expert_team_id = 3; int64 expected_version = 4; }
message DeleteSessionRequest { string session_id = 1; }
message Session { string id = 1; string title = 2; optional string expert_id = 3; bool archived = 4; google.protobuf.Timestamp created_at = 5; google.protobuf.Timestamp updated_at = 6; int64 version = 7; reserved 8; reserved "current_provider_model_id"; optional string expert_team_id = 9; }
message ListSessionMessagesRequest { string session_id = 1; optional int64 after = 2; optional int32 limit = 3; }
message ListSessionMessagesResponse { repeated SessionMessage items = 1; }
message SendSessionMessageRequest { string session_id = 1; string content = 2; reserved 3; reserved "provider_model_id"; repeated string attachment_ids = 4; }
message SendSessionMessageResponse { SessionMessage user_message = 1; SessionMessage assistant_message = 2; }
message RetrySessionMessageRequest { string session_id = 1; int64 message_id = 2; }
message CancelSessionMessageRequest { string session_id = 1; int64 message_id = 2; }
message SessionMessage { int64 id = 1; string role = 2; string state = 3; string content = 4; optional string error = 5; int64 elapsed_ms = 6; google.protobuf.Timestamp created_at = 7; string progress_stage = 8; optional ResponseSnapshot response_snapshot = 9; repeated Attachment attachments = 10; repeated ExpertStage expert_stages = 11; optional CreditConsumption credit_consumption = 12; }
message ResponseSnapshot { string provider_model_id = 1; string connection_id = 2; string connection_name = 3; string provider_type = 4; string model_id = 5; string model_name = 6; string endpoint = 7; repeated string protocols = 8; string runtime_engine = 9; string compatibility = 10; int64 connection_version = 11; int32 schema_version = 12; repeated ExecutionStageSnapshot stages = 13; }
message ExecutionStageSnapshot { int32 position = 1; optional ExpertSnapshot expert = 2; string runtime_engine = 3; ProviderModelSnapshot provider_model = 4; repeated MCPServerSnapshot mcp_servers = 5; repeated SkillSnapshot skills = 6; }
message ExpertSnapshot { string id = 1; string name = 2; string execution_instruction = 3; int64 version = 4; }
message ProviderModelSnapshot { string id = 1; string connection_id = 2; int64 connection_version = 3; string connection_name = 4; string provider_type = 5; string model_id = 6; string name = 7; string endpoint = 8; repeated string protocols = 9; string compatibility = 10; }
message MCPServerSnapshot { string id = 1; string name = 2; string transport = 3; optional string url = 4; optional string runner = 5; optional string package = 6; optional string package_version = 7; repeated string arguments = 8; }
message SkillSnapshot { string id = 1; string name = 2; string object_key = 3; string sha256 = 4; }

message ListWorkflowsRequest { bool deleted = 1; }
message ListWorkflowsResponse { repeated Workflow items = 1; }
message CreateWorkflowRequest { WorkflowInput workflow = 1; }
message GetWorkflowRequest { string workflow_id = 1; }
message UpdateWorkflowRequest { string workflow_id = 1; WorkflowInput workflow = 2; int64 expected_version = 3; }
message DeleteWorkflowRequest { string workflow_id = 1; }
message WorkflowInput { string name = 1; string goal = 2; optional string expert_id = 3; reserved 4, 5; reserved "provider_model_id", "runtime_engine"; repeated EnvironmentVariable environment = 6; optional Schedule schedule = 7; optional string expert_team_id = 8; }
message Workflow { string id = 1; string name = 2; string goal = 3; optional string expert_id = 4; reserved 5, 6; reserved "provider_model_id", "runtime_engine"; repeated EnvironmentVariable environment = 7; optional Schedule schedule = 8; optional GitSource git_source = 9; bool api_credential_configured = 10; bool deleted = 11; google.protobuf.Timestamp created_at = 12; google.protobuf.Timestamp updated_at = 13; int64 version = 14; optional string expert_team_id = 15; }
message EnvironmentVariable { string name = 1; optional string value = 2; bool secret = 3; bool configured = 4; }
message Schedule { bool enabled = 1; string frequency = 2; int32 hour = 3; int32 minute = 4; int32 weekday = 5; string timezone = 6; }
message GitConfigEntry { string key = 1; string value = 2; }
message GitSource { string url = 1; string branch = 2; string authentication = 3; bool credential_configured = 4; optional string username = 5; repeated GitConfigEntry config = 6; }
message GenerateWorkflowCredentialRequest { string workflow_id = 1; }
message WorkflowCredential { string api_key = 1; string api_secret = 2; google.protobuf.Timestamp created_at = 3; }
message ExchangeWorkflowCredentialRequest { string workflow_id = 1; }
message WorkflowAccessToken { string jwt_token = 1; string token_type = 2; google.protobuf.Timestamp expires_at = 3; }

message RunWorkflowRequest { string workflow_id = 1; optional string text_input = 2; optional google.protobuf.Struct json_input = 3; }
message ListRunsRequest { string workflow_id = 1; }
message ListRunsResponse { repeated Run items = 1; }
message GetRunRequest { string workflow_id = 1; string run_id = 2; }
message ListRunTurnsRequest { string workflow_id = 1; string run_id = 2; }
message ContinueRunConversationRequest { string workflow_id = 1; string run_id = 2; string content = 3; repeated string attachment_ids = 4; }
message CancelRunRequest { string workflow_id = 1; string run_id = 2; }
message RerunWorkflowRequest { string workflow_id = 1; string run_id = 2; }
message Run { string id = 1; string workflow_id = 2; string workflow_name = 3; string trigger = 4; string state = 5; optional string text_input = 6; optional google.protobuf.Struct json_input = 7; optional string final_text = 8; optional google.protobuf.Struct final_json = 9; optional string error = 10; google.protobuf.Timestamp queued_at = 11; optional google.protobuf.Timestamp started_at = 12; optional google.protobuf.Timestamp ended_at = 13; int64 elapsed_ms = 14; optional google.protobuf.Struct workflow_snapshot = 15; string conversation_id = 16; int32 turn_number = 17; repeated Attachment attachments = 18; repeated ExpertStage expert_stages = 19; optional CreditConsumption credit_consumption = 20; }

message ListArtifactsRequest { string workflow_id = 1; }
message ListArtifactsResponse { repeated Artifact items = 1; }
message GetArtifactDownloadRequest { string workflow_id = 1; string artifact_id = 2; }
message ArtifactDownload { string url = 1; google.protobuf.Timestamp expires_at = 2; }
message Artifact { string id = 1; string run_id = 2; string kind = 3; string name = 4; string path = 5; int64 size = 6; string sha256 = 7; optional string text_preview = 8; bool expired = 9; google.protobuf.Timestamp created_at = 10; optional google.protobuf.Timestamp expires_at = 11; }

message ListWorkspaceEntriesRequest { string workflow_id = 1; optional string path = 2; }
message ListWorkspaceEntriesResponse { repeated WorkspaceEntry items = 1; int64 used_bytes = 2; int64 limit_bytes = 3; }
message GetWorkspaceFileRequest { string workflow_id = 1; string path = 2; }
message WorkspaceFile { string path = 1; bytes content = 2; string content_type = 3; int64 size = 4; google.protobuf.Timestamp modified_at = 5; }
message ConfigureWorkflowGitSourceRequest { string workflow_id = 1; string url = 2; string branch = 3; string authentication = 4; optional string username = 5; optional string password = 6; optional string ssh_private_key = 7; repeated GitConfigEntry config = 8; }
message WorkspaceEntry { string path = 1; string name = 2; bool directory = 3; int64 size = 4; google.protobuf.Timestamp modified_at = 5; }

message ListExpertsRequest {}
message ListExpertsResponse { repeated Expert items = 1; }
message GetExpertRequest { string expert_id = 1; }
message CreateExpertRequest { ExpertInput expert = 1; }
message UpdateExpertRequest { string expert_id = 1; ExpertInput expert = 2; int64 expected_version = 3; }
message DeleteExpertRequest { string expert_id = 1; }
message ExpertInput { string name = 1; string capability_introduction = 2; repeated string mcp_server_ids = 3; repeated string skill_ids = 4; string execution_instruction = 5; repeated string expertise_tags = 6; string provider_model_id = 7; string runtime_engine = 8; }
message Expert { string id = 1; string name = 2; string capability_introduction = 3; repeated string mcp_server_ids = 4; repeated string skill_ids = 5; google.protobuf.Timestamp created_at = 6; google.protobuf.Timestamp updated_at = 7; int64 version = 8; string execution_instruction = 9; repeated string expertise_tags = 10; bool available = 11; string provider_model_id = 12; string runtime_engine = 13; bool complete = 14; optional string availability_reason = 15; string compatibility = 16; string provider_model_name = 17; }

message ListExpertTeamsRequest {}
message ListExpertTeamsResponse { repeated ExpertTeam items = 1; }
message GetExpertTeamRequest { string expert_team_id = 1; }
message CreateExpertTeamRequest { ExpertTeamInput expert_team = 1; }
message UpdateExpertTeamRequest { string expert_team_id = 1; ExpertTeamInput expert_team = 2; int64 expected_version = 3; }
message DeleteExpertTeamRequest { string expert_team_id = 1; }
message ExpertTeamInput { string name = 1; string capability_introduction = 2; repeated string expertise_tags = 3; repeated string expert_ids = 4; }
message ExpertTeam { string id = 1; string name = 2; string capability_introduction = 3; repeated string expertise_tags = 4; repeated Expert experts = 5; bool available = 6; google.protobuf.Timestamp created_at = 7; google.protobuf.Timestamp updated_at = 8; int64 version = 9; }
message ExpertStage { string expert_id = 1; string expert_name = 2; int32 position = 3; string state = 4; int64 elapsed_ms = 5; optional string final_text = 6; optional string error = 7; int32 total = 8; optional CreditStageConsumption credit_consumption = 9; string provider_model_id = 10; string provider_model_name = 11; string runtime_engine = 12; }
message CreditConsumption { int64 total_hundredths = 1; repeated CreditStageConsumption stages = 2; }
message CreditStageConsumption { int32 stage_position = 1; string provider_model = 2; string runtime_engine = 3; int64 input_tokens = 4; int64 output_tokens = 5; bool usage_reported = 6; int64 input_multiplier_micros = 7; int64 output_multiplier_micros = 8; int64 fallback_hundredths = 9; int64 amount_hundredths = 10; bool estimated = 11; string rate_revision_id = 12; }

message GetSettingsRequest {}
message UpdateSettingsRequest { string personality = 1; string personality_instructions = 2; repeated RuntimeModelDefault runtime_model_defaults = 3; string default_runtime_engine = 4; string language = 5; string timezone = 6; int64 expected_version = 7; }
message PersonalSettings { string personality = 1; string personality_instructions = 2; repeated RuntimeModelDefault runtime_model_defaults = 3; string default_runtime_engine = 4; string language = 5; string timezone = 6; int64 version = 7; }
message RuntimeModelDefault { string runtime_engine = 1; string provider_model_id = 2; }
message ListRuntimeEnginesRequest {}
message ListRuntimeEnginesResponse { repeated RuntimeEngineStatus items = 1; }
message RuntimeEngineStatus { string name = 1; bool available = 2; bool native_resume = 3; string cli_version = 4; }
message ListModelProviderPresetsRequest {}
