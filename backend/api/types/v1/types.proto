syntax = "proto3";
package types.v1;

import "google/protobuf/timestamp.proto";

option go_package = "agent-platform/backend/api/types/v1;typesv1";

message ModelBinding {
  string model_id = 1;
  string endpoint = 2;
  string credential_profile_id = 3;
}

message ModelBudget {
  int64 max_input_tokens = 1;
  int64 max_output_tokens = 2;
  string max_cost_amount = 3;
}

message ExecutionLimits {
  int64 timeout_seconds = 1;
  double cpus = 2;
  int64 memory_bytes = 3;
  int64 pids = 4;
  int64 temp_bytes = 5;
  string egress = 6;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  string cost_amount = 3;
}

message ExecutionError {
  string code = 1;
  string message = 2;
}

message AgentConfiguration {
  string instructions = 1;
  string repository_binding_id = 2;
  string runtime_image_id = 3;
  string configured_model_id = 4;
  ModelBudget model_budget = 5;
  ExecutionLimits execution_limits = 6;
  bool native_subagents = 7;
}

message ValidationReport {
  bool valid = 1;
  map<string, string> errors = 2;
  google.protobuf.Timestamp checked_at = 3;
}

message QualityCommand {
  string name = 1;
  string kind = 2;
  string executable = 3;
  repeated string arguments = 4;
  int32 timeout_seconds = 5;
}

message EgressPolicy {
  string mode = 1;
}

message SessionMemory {
  optional string summary = 1;
  repeated string confirmed_decisions = 2;
  repeated string results = 3;
  repeated string workspace_snapshots = 4;
}

message IssueSnapshot {
  string title = 1;
  string body = 2;
  optional string url = 3;
}

message SessionMessageContent {
  optional string type = 1;
  optional string text = 2;
  optional string status = 3;
  optional string run_id = 4;
  optional string review_branch = 5;
}
