syntax = "proto3";

package identity.v1;

import "google/api/annotations.proto";

option go_package = "agent-platform/backend/api/identity/v1;identityv1";

service IdentityService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (CurrentUser) {
    option (google.api.http) = {get: "/v1/me"};
  }
}

message GetCurrentUserRequest {}

message CurrentUser {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  Organization organization = 4;
  repeated RoleGrant role_grants = 5;
}

message Organization {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message RoleGrant {
  optional string team_id = 1;
  string role = 2;
}
