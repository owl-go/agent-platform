syntax = "proto3";
package audit.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "agent-platform/backend/api/audit/v1;auditv1";

service AuditService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) { option (google.api.http) = {get: "/v1/audit-events"}; }
}

message ListAuditEventsRequest {
  string team_id = 1;
  optional string action = 2;
  optional string resource_type = 3;
  optional string resource_id = 4;
  optional string actor_user_id = 5;
  optional google.protobuf.Timestamp created_from = 6;
  optional google.protobuf.Timestamp created_to = 7;
  optional int32 limit = 8;
  optional string outcome = 9;
}
message ListAuditEventsResponse { repeated AuditEvent items = 1; }
message AuditEvent {
  int64 id = 1;
  string team_id = 2;
  optional string actor_user_id = 3;
  string action = 4;
  string resource_type = 5;
  string resource_id = 6;
  google.protobuf.Struct details = 7;
  google.protobuf.Timestamp created_at = 8;
  string outcome = 9;
}
