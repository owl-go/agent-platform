syntax = "proto3";
package sourcecontrol.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "types/v1/types.proto";

option go_package = "agent-platform/backend/api/sourcecontrol/v1;sourcecontrolv1";

service SourceControlService {
  rpc ListSourceControlProviders(ListSourceControlProvidersRequest) returns (ListSourceControlProvidersResponse) { option (google.api.http) = {get: "/v1/source-control-providers"}; }
  rpc GetSourceControlProvider(GetSourceControlProviderRequest) returns (SourceControlProvider) { option (google.api.http) = {get: "/v1/source-control-providers/{source_control_provider_id}"}; }
  rpc RegisterSourceControlProvider(RegisterSourceControlProviderRequest) returns (SourceControlProvider) {
    option (google.api.http) = {post: "/v1/source-control-providers" body: "*"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = { parameters: { headers: { name: "Idempotency-Key" type: STRING required: true } } };
  }
  rpc ChangeSourceControlProviderStatus(ChangeSourceControlProviderStatusRequest) returns (SourceControlProvider) {
    option (google.api.http) = {patch: "/v1/source-control-providers/{source_control_provider_id}/status" body: "*"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = { parameters: {
      headers: { name: "Idempotency-Key" type: STRING required: true }
      headers: { name: "If-Match" type: STRING required: true }
    } };
  }
  rpc ListRepositoryBindings(ListRepositoryBindingsRequest) returns (ListRepositoryBindingsResponse) { option (google.api.http) = {get: "/v1/repository-bindings"}; }
  rpc GetRepositoryBinding(GetRepositoryBindingRequest) returns (RepositoryBinding) { option (google.api.http) = {get: "/v1/repository-bindings/{repository_binding_id}"}; }
  rpc RegisterRepositoryBinding(RegisterRepositoryBindingRequest) returns (RepositoryBinding) {
    option (google.api.http) = {post: "/v1/repository-bindings" body: "*"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = { parameters: { headers: { name: "Idempotency-Key" type: STRING required: true } } };
  }
  rpc UpdateRepositoryBinding(UpdateRepositoryBindingRequest) returns (RepositoryBinding) {
    option (google.api.http) = {patch: "/v1/repository-bindings/{repository_binding_id}" body: "*"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = { parameters: {
      headers: { name: "Idempotency-Key" type: STRING required: true }
      headers: { name: "If-Match" type: STRING required: true }
    } };
  }
  rpc ValidateRepositoryBinding(ValidateRepositoryBindingRequest) returns (RepositoryBinding) {
    option (google.api.http) = {post: "/v1/repository-bindings/{repository_binding_id}/validation" body: "*"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = { parameters: {
      headers: { name: "Idempotency-Key" type: STRING required: true }
      headers: { name: "If-Match" type: STRING required: true }
    } };
  }
}

message ListSourceControlProvidersRequest {}
message ListSourceControlProvidersResponse { repeated SourceControlProvider items = 1; }
message GetSourceControlProviderRequest { string source_control_provider_id = 1; }
message GetSourceControlProviderResponse { SourceControlProvider source_control_provider = 1; }
message RegisterSourceControlProviderRequest { string name = 1; string kind = 2; string base_url = 3; }
message RegisterSourceControlProviderResponse { SourceControlProvider source_control_provider = 1; }
message ChangeSourceControlProviderStatusRequest { string source_control_provider_id = 1; bool enabled = 2; }
message ChangeSourceControlProviderStatusResponse { SourceControlProvider source_control_provider = 1; }
message ListRepositoryBindingsRequest { string team_id = 1; }
message ListRepositoryBindingsResponse { repeated RepositoryBinding items = 1; }
message GetRepositoryBindingRequest { string repository_binding_id = 1; string team_id = 2; }
message GetRepositoryBindingResponse { RepositoryBinding repository_binding = 1; }

message RepositoryBindingInput {
  string team_id = 1;
  string source_control_provider_id = 2;
  string name = 3;
  string repository_ssh_url = 4;
  string default_branch = 5;
  string ssh_credential_profile_id = 6;
  repeated string build_credential_profile_ids = 7;
  string git_author_name = 8;
  string git_author_email = 9;
  repeated string allowed_runtime_image_ids = 10;
  string default_runtime_image_id = 11;
  string default_model_id = 12;
  types.v1.ModelBudget model_budget = 13;
  string instructions = 14;
  repeated types.v1.QualityCommand quality_commands = 15;
  types.v1.EgressPolicy egress_policy = 16;
  repeated string required_runtime_capabilities = 17;
}
message RegisterRepositoryBindingRequest { RepositoryBindingInput binding = 1; }
message RegisterRepositoryBindingResponse { RepositoryBinding repository_binding = 1; }
message UpdateRepositoryBindingRequest { string repository_binding_id = 1; RepositoryBindingInput binding = 2; }
message UpdateRepositoryBindingResponse { RepositoryBinding repository_binding = 1; }
message ValidateRepositoryBindingRequest { string repository_binding_id = 1; string team_id = 2; }
message ValidateRepositoryBindingResponse { RepositoryBinding repository_binding = 1; }

message SourceControlProvider {
  string id = 1;
  string name = 2;
  string kind = 3;
  string base_url = 4;
  bool enabled = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int64 version = 8;
}
message RepositoryBinding {
  string id = 1;
  string team_id = 2;
  string source_control_provider_id = 3;
  string name = 4;
  string repository_ssh_url = 5;
  string default_branch = 6;
  string ssh_credential_profile_id = 7;
  repeated string build_credential_profile_ids = 8;
  string git_author_name = 9;
  string git_author_email = 10;
  repeated string allowed_runtime_image_ids = 11;
  string default_runtime_image_id = 12;
  string default_model_id = 13;
  types.v1.ModelBudget model_budget = 14;
  string instructions = 15;
  repeated types.v1.QualityCommand quality_commands = 16;
  types.v1.EgressPolicy egress_policy = 17;
  optional types.v1.ValidationReport validation_report = 18;
  optional google.protobuf.Timestamp validated_at = 19;
  google.protobuf.Timestamp created_at = 20;
  google.protobuf.Timestamp updated_at = 21;
  int64 version = 22;
  repeated string required_runtime_capabilities = 23;
}
