syntax = "proto3";
package artifact.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "agent-platform/backend/api/artifact/v1;artifactv1";

service ArtifactService {
  rpc ListRunArtifacts(ListRunArtifactsRequest) returns (ListRunArtifactsResponse) { option (google.api.http) = {get: "/v1/runs/{run_id}/artifacts"}; }
  rpc GetArtifactDownload(GetArtifactDownloadRequest) returns (GetArtifactDownloadResponse) { option (google.api.http) = {get: "/v1/artifacts/{artifact_id}/download"}; }
}

message ListRunArtifactsRequest { string run_id = 1; }
message ListRunArtifactsResponse { repeated Artifact items = 1; }
message GetArtifactDownloadRequest { string artifact_id = 1; }
message GetArtifactDownloadResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message Artifact {
  string id = 1;
  string run_id = 2;
  string kind = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  string content_type = 6;
  map<string, string> metadata = 7;
  optional google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
}
