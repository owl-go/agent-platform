syntax = "proto3";

package execution.v1;

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "types/v1/types.proto";

option go_package = "agent-platform/backend/api/execution/v1;executionv1";

service ExecutionService {
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse) {
    option (google.api.http) = {get: "/v1/runs"};
  }
  rpc GetRun(GetRunRequest) returns (Run) {
    option (google.api.http) = {get: "/v1/runs/{run_id}"};
  }
  rpc InterruptRun(InterruptRunRequest) returns (Run) {
    option (google.api.http) = {post: "/v1/runs/{run_id}/interrupt"};
  }
  rpc ResumeRun(ResumeRunRequest) returns (Run) {
    option (google.api.http) = {post: "/v1/runs/{run_id}/resume"};
  }
  rpc CancelRun(CancelRunRequest) returns (Run) {
    option (google.api.http) = {post: "/v1/runs/{run_id}/cancel"};
  }
  rpc KillRun(KillRunRequest) returns (Run) {
    option (google.api.http) = {post: "/v1/runs/{run_id}/kill"};
  }
}

message ListRunsRequest {
  string team_id = 1;
  optional string agent_id = 2;
  optional string repository_binding_id = 3;
  optional string task_id = 4;
  optional string state = 5;
  optional string runtime = 6;
  optional google.protobuf.Timestamp created_from = 7;
  optional google.protobuf.Timestamp created_to = 8;
  optional int32 limit = 9;
}
message ListRunsResponse { repeated Run items = 1; }
message GetRunRequest { string run_id = 1; }
message GetRunResponse { Run run = 1; }
message InterruptRunRequest { string run_id = 1; }
message InterruptRunResponse { Run run = 1; }
message ResumeRunRequest { string run_id = 1; }
message ResumeRunResponse { Run run = 1; }
message CancelRunRequest { string run_id = 1; }
message CancelRunResponse { Run run = 1; }
message KillRunRequest { string run_id = 1; }
message KillRunResponse { Run run = 1; }

message Run {
  string id = 1;
  string session_id = 2;
  string agent_release_id = 3;
  string runtime_image_id = 4;
  string request_text = 5;
  string state = 6;
  types.v1.ModelBinding model_binding = 7;
  types.v1.ModelBudget model_budget = 8;
  types.v1.ExecutionLimits execution_limits = 9;
  types.v1.Usage usage = 10;
  string cost_amount = 11;
  optional types.v1.ExecutionError terminal_error = 12;
  int32 attempt_count = 13;
  string created_by = 14;
  google.protobuf.Timestamp created_at = 15;
  optional google.protobuf.Timestamp started_at = 16;
  optional google.protobuf.Timestamp ended_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  int64 version = 19;
  repeated Attempt attempts = 20;
}

message Attempt {
  string id = 1;
  int32 number = 2;
  string worker_id = 3;
  string state = 4;
  bool infrastructure_failure = 5;
  optional types.v1.ExecutionError error = 6;
  google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp ended_at = 8;
}

service RunEventStreamService {
  rpc Stream(StreamRequest) returns (stream StreamResponse) {
    option (google.api.http) = {get: "/v1/runs/{run_id}/events"};
  }
}

message StreamRequest {
  string run_id = 1;
  int64 after = 2;
}

message StreamResponse {
  int64 sequence = 1;
  string event_type = 2;
  google.protobuf.Value payload = 3;
  google.protobuf.Timestamp created_at = 4;
}
