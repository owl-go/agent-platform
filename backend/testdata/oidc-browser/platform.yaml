api:
  address: "127.0.0.1:18090"
  read_header_timeout: 5s
  idle_timeout: 60s
  shutdown_timeout: 10s

authentication:
  mode: oidc
  issuer: "http://127.0.0.1:18091/realms/agent-platform"
  audience: agent-platform-api
  client_id: agent-platform-web
  organization_claim: organization
  redirect_uri: "http://127.0.0.1:18092/auth/callback"
  logout_redirect_uri: "http://127.0.0.1:18092"
  signing_algorithms: [RS256]
  discovery_timeout: 5s
  jwks_timeout: 3s

worker:
  management_address: "127.0.0.1:18093"
  shutdown_timeout: 5s
  reconcile_interval: 5s
  max_attempts: 3
  execution_enabled: false

webhook:
  enabled: false

retention:
  enabled: false
  sweep_interval: 1h
  batch_size: 100
  run_event_period: 2160h
  artifact_period: 2160h
  workspace_period: 720h
  audit_period: 8760h
  idempotency_grace: 1h

database:
  dsn: "${OIDC_BROWSER_DATABASE_DSN}"
  max_open_connections: 10
  max_idle_connections: 2
  connection_max_idle: 1m
  connection_max_lifetime: 5m

object_store:
  provider: minio
  minio:
    endpoint: 127.0.0.1:19000
    access_key: acceptance
    secret_key: acceptance-only-secret
    bucket: acceptance
    secure: false
  aliyun_oss: {}

sandbox:
  runtime: runsc
  egress_network: agent-public-egress
  resolver_config: /etc/agent-platform/sandbox-resolv.conf
