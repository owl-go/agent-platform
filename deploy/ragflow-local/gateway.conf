server {
    listen 80;
    client_max_body_size 101m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Tunnel only the adapter API. Login, registration, admin, chat/agent
    # execution and the RAGFlow UI remain local to the machine.
    location ~ ^/api/v1/(datasets(/[A-Za-z0-9-]+(/(documents(/[A-Za-z0-9-]+(/chunks)?)?|chunks))?)?|retrieval)$ {
        proxy_pass http://ragflow:9380;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location / { return 404; }
}
