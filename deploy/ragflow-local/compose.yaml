name: agent-workspace-ragflow
services:
  elasticsearch:
    image: elasticsearch@sha256:58a3a280935d830215802322e9a0373faaacdfd646477aa7e718939c2f29292a
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.http.ssl.enabled: 'false'
      xpack.security.transport.ssl.enabled: 'false'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.watermark.low: 3gb
      cluster.routing.allocation.disk.watermark.high: 2gb
      cluster.routing.allocation.disk.watermark.flood_stage: 1gb
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    mem_limit: 1536m
    restart: unless-stopped
  mysql:
    image: mysql@sha256:ccb8f749bb5e59f9f8f03bf7282c7ef27a93a1814a24f0a8a926fb4e19b7fb97
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_DATABASE: rag_flow
    command: [--max-connections=200, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --max-allowed-packet=1073741824]
    volumes: [mysql-data:/var/lib/mysql]
    mem_limit: 768m
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped
  redis:
    image: valkey/valkey@sha256:57bcc49c6ade1813ef25206c571b65b66bb0094235ff7fb767941622892297d9
    command: [redis-server, --requirepass, '${REDIS_PASSWORD:?required}', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    mem_limit: 256m
    restart: unless-stopped
  ragflow:
    image: infiniflow/ragflow@sha256:508cc283f5d61d1e565820a8e0ae8d98f9a8ac4b3b8cf7aefc5f0093e4bb4c50
    platform: linux/amd64
    depends_on:
      mysql: {condition: service_healthy}
    ports: [127.0.0.1:19380:80]
    environment:
      STORAGE_IMPL: OPENDAL
      DOC_ENGINE: elasticsearch
      DEVICE: cpu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      RAGFLOW_SECRET_KEY: ${RAGFLOW_SECRET_KEY:?required}
      REGISTER_ENABLED: '1'
      TZ: Asia/Shanghai
    extra_hosts: [host.docker.internal:host-gateway]
    volumes:
      - ./ui.conf:/etc/nginx/conf.d/default.conf:ro
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
      - ragflow-logs:/ragflow/logs
    mem_limit: 4g
    restart: unless-stopped
  gateway:
    image: nginx@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    depends_on: [ragflow]
    ports: [127.0.0.1:19381:80]
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    restart: unless-stopped
volumes:
  elasticsearch-data:
  mysql-data:
  redis-data:
  ragflow-logs:
