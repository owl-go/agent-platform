server {
    listen 80;
    client_max_body_size 101m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Exact Knowledge API paths go through the restricted RAGFlow gateway.
    location ~ ^/api/v1/(datasets(/[A-Za-z0-9-]+(/(documents(/[A-Za-z0-9-]+(/chunks)?)?|chunks))?)?|retrieval)$ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    # Retain every other route on the existing local model relay.
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
    }
}
