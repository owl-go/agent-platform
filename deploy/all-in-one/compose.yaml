name: agent-platform
services:
  runtime-image:
    image: ${RUNTIME_IMAGE:-haozhi152/agent-platform-runtime:latest}
    command: ["/bin/true"]
    restart: "no"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  app:
    image: haozhi152/agent-platform:${IMAGE_TAG:-latest}
    container_name: agent-platform
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SANDBOX_PROFILE: ${SANDBOX_PROFILE:-local}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE:-haozhi152/agent-platform-runtime:latest}
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      runtime-image:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    pids_limit: 2048
    mem_limit: 4g
    cpus: 4
volumes:
  data:
