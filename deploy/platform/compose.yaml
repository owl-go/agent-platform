name: agent-platform

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE must be an immutable repository digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-agent_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be an immutable repository digest}
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    networks:
      - control
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: ${MINIO_IMAGE:?MINIO_IMAGE must be an immutable repository digest}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set private "local/$${MINIO_BUCKET}" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-platform}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: agent-platform-api:local
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile.service
      args:
        SERVICE: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agent_platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_platform}?sslmode=disable
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-platform}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?KEYCLOAK_BASE_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID:?KEYCLOAK_SERVICE_CLIENT_ID is required}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?KEYCLOAK_SERVICE_CLIENT_SECRET is required}
      BOOTSTRAP_ADMIN_SUBJECT: ${BOOTSTRAP_ADMIN_SUBJECT:?BOOTSTRAP_ADMIN_SUBJECT is required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}
      CREDENTIAL_TEMP_ROOT: ${CREDENTIAL_TEMP_ROOT:?CREDENTIAL_TEMP_ROOT is required}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:?CLAUDE_RUNTIME_IMAGE is required}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:?CODEX_RUNTIME_IMAGE is required}
      HERMES_RUNTIME_IMAGE: ${HERMES_RUNTIME_IMAGE:?HERMES_RUNTIME_IMAGE is required}
      OPENCLAW_RUNTIME_IMAGE: ${OPENCLAW_RUNTIME_IMAGE:?OPENCLAW_RUNTIME_IMAGE is required}
      PI_RUNTIME_IMAGE: ${PI_RUNTIME_IMAGE:?PI_RUNTIME_IMAGE is required}
    command: ["-config", "/etc/agent-platform/platform.yaml"]
    volumes:
      - ${PLATFORM_CONFIG_FILE:-./config/platform.minio.yaml}:/etc/agent-platform/platform.yaml:ro
      - ${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}:${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}
      - ${WORKSPACE_KNOWN_HOSTS:?WORKSPACE_KNOWN_HOSTS is required}:/etc/agent-workspace/known_hosts:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - control
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: agent-platform-worker:local
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile.service
      args:
        SERVICE: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agent_platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_platform}?sslmode=disable
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-agent-platform}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
      VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:?KEYCLOAK_BASE_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?KEYCLOAK_REALM is required}
      KEYCLOAK_SERVICE_CLIENT_ID: ${KEYCLOAK_SERVICE_CLIENT_ID:?KEYCLOAK_SERVICE_CLIENT_ID is required}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?KEYCLOAK_SERVICE_CLIENT_SECRET is required}
      BOOTSTRAP_ADMIN_SUBJECT: ${BOOTSTRAP_ADMIN_SUBJECT:?BOOTSTRAP_ADMIN_SUBJECT is required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL is required}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}
      CREDENTIAL_TEMP_ROOT: ${CREDENTIAL_TEMP_ROOT:?CREDENTIAL_TEMP_ROOT is required}
      CLAUDE_RUNTIME_IMAGE: ${CLAUDE_RUNTIME_IMAGE:?CLAUDE_RUNTIME_IMAGE is required}
      CODEX_RUNTIME_IMAGE: ${CODEX_RUNTIME_IMAGE:?CODEX_RUNTIME_IMAGE is required}
      HERMES_RUNTIME_IMAGE: ${HERMES_RUNTIME_IMAGE:?HERMES_RUNTIME_IMAGE is required}
      OPENCLAW_RUNTIME_IMAGE: ${OPENCLAW_RUNTIME_IMAGE:?OPENCLAW_RUNTIME_IMAGE is required}
      PI_RUNTIME_IMAGE: ${PI_RUNTIME_IMAGE:?PI_RUNTIME_IMAGE is required}
    command: ["-config", "/etc/agent-platform/platform.yaml"]
    volumes:
      - ${PLATFORM_CONFIG_FILE:-./config/platform.minio.yaml}:/etc/agent-platform/platform.yaml:ro
      - ${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}:${WORKSPACE_ROOT:?WORKSPACE_ROOT is required}
      - ${WORKSPACE_KNOWN_HOSTS:?WORKSPACE_KNOWN_HOSTS is required}:/etc/agent-workspace/known_hosts:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - control
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: agent-platform-web:local
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile.web
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - ${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  control:
    internal: true
  edge:

volumes:
  postgres-data:
  minio-data:
