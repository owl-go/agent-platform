api:
  address: ":8080"
  read_header_timeout: 5s
  idle_timeout: 60s
  shutdown_timeout: 10s

authentication:
  mode: oidc
  issuer: "${OIDC_ISSUER}"
  audience: "${OIDC_AUDIENCE}"
  client_id: "${VITE_OIDC_CLIENT_ID}"
  redirect_uri: "${VITE_OIDC_REDIRECT_URI}"
  logout_redirect_uri: "${VITE_OIDC_POST_LOGOUT_REDIRECT_URI}"
  signing_algorithms: [RS256]
  discovery_timeout: 5s
  jwks_timeout: 3s

accounts:
  keycloak_base_url: "${KEYCLOAK_BASE_URL}"
  realm: "${KEYCLOAK_REALM}"
  admin_client_id: "${KEYCLOAK_SERVICE_CLIENT_ID}"
  admin_client_secret: "${KEYCLOAK_SERVICE_CLIENT_SECRET}"
  bootstrap_subject: "${BOOTSTRAP_ADMIN_SUBJECT}"
  bootstrap_username: "platform-admin"
  bootstrap_email: "${BOOTSTRAP_ADMIN_EMAIL}"
  bootstrap_display_name: "Platform Administrator"

workspace:
  root: "${WORKSPACE_ROOT}"
  known_hosts: /etc/agent-workspace/known_hosts

security:
  data_encryption_key: "${DATA_ENCRYPTION_KEY}"

worker:
  management_address: "127.0.0.1:9090"
  shutdown_timeout: 10s
  poll_interval: 1s
  runtime_idle_timeout: 30m
  credential_temp_root: "${CREDENTIAL_TEMP_ROOT}"
  sandbox_uid: 65532
  sandbox_gid: 65532
  cli_builder:
    enabled: false
    image_digest: ""
    egress_network: ""
    timeout: 10m
  runtimes:
    claude: {available: true, native_resume: false, image_digest: "${CLAUDE_RUNTIME_IMAGE}", cli_version: "2.1.233"}
    codex: {available: true, native_resume: true, image_digest: "${CODEX_RUNTIME_IMAGE}", cli_version: "0.147.0"}
    hermes: {available: true, native_resume: false, image_digest: "${HERMES_RUNTIME_IMAGE}", cli_version: "0.19.0"}
    openclaw: {available: true, native_resume: false, image_digest: "${OPENCLAW_RUNTIME_IMAGE}", cli_version: "2026.7.1-2"}
    pi: {available: true, native_resume: false, image_digest: "${PI_RUNTIME_IMAGE}", cli_version: "0.84.4"}

database:
  dsn: "${DATABASE_URL}"
  max_open_connections: 20
  max_idle_connections: 10
  connection_max_idle: 5m
  connection_max_lifetime: 30m

object_store:
  provider: minio
  minio:
    endpoint: minio:9000
    access_key: "${MINIO_ROOT_USER}"
    secret_key: "${MINIO_ROOT_PASSWORD}"
    bucket: "${MINIO_BUCKET}"
    secure: false
  aliyun_oss: {}

sandbox:
  runtime: runsc
  egress_network: agent-public-egress
  resolver_config: /etc/agent-platform/sandbox-resolv.conf
